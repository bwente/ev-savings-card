name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1);'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/integration -q
      - run: npm run validate
      - run: git diff --exit-code -- dist/ev-savings-card.js custom_components/ev_savings/www/ev-savings-card.js
      - run: python scripts/package-integration.py
      - name: Create draft release with installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/ev-savings-card.js dist/ev-savings-integration.zip --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
